<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HTML5 Opener</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #555555;
      --panel: #f5f5f5;
      --border: #d8d8d8;
      --primary: #0b5cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 14px 18px;
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 20px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .left {
      width: 440px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    input[type="file"] {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: white;
    }

    button {
      padding: 9px 14px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      background: white;
      font: inherit;
      cursor: pointer;
    }

    .dropzone {
      border: 2px dashed #888;
      border-radius: 8px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #444;
      background: #fafafa;
      padding: 18px;
      cursor: copy;
      user-select: none;
    }

    .dropzone.dragover {
      background: #eef4ff;
      border-color: var(--primary);
    }

    .previewWrap {
      flex: 1;
      min-width: 0;
    }

    .previewBox {
      border: 1px solid var(--border);
      background: white;
      min-height: 420px;
      max-height: 420px;
      overflow: auto;
      padding: 12px;
      white-space: pre-wrap;
      font-family: Consolas, "SFMono-Regular", Menlo, monospace;
      font-size: 13px;
      color: #111;
    }

    footer {
      background: #f3f6ff;
      color: #333;
      border-top: 1px solid #e5e8f0;
      padding: 12px 18px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      main {
        flex-direction: column;
      }
      .left {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>HTML5 Opener — upload or drop an .html file and open it</header>

  <main>
    <div class="left">
      <div>
        <div class="section-label">Upload HTML file</div>
        <div class="muted">
          Choose an .html file from your computer or drag &amp; drop it below.
        </div>
      </div>

      <div class="controls">
        <input id="fileInput" type="file" accept=".html,text/html" />
        <button id="openBtn" type="button">Open (current file)</button>
        <button id="openNewBtn" type="button">Open in new tab</button>
      </div>

      <div class="dropzone" id="dropzone">Or drag &amp; drop an .html file here</div>
    </div>

    <div class="previewWrap">
      <div class="section-label">Preview (sanitized)</div>
      <div id="preview" class="previewBox"></div>
    </div>
  </main>

  <footer>
    Built to open HTML files. The preview is sanitized and only intended to show the structure.
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const fileInput = document.getElementById('fileInput');
      const openBtn = document.getElementById('openBtn');
      const openNewBtn = document.getElementById('openNewBtn');
      const dropzone = document.getElementById('dropzone');
      const preview = document.getElementById('preview');

      let currentContent = '';

      function previewHTML(raw) {
        try {
          const safe = (raw || '').replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '<!-- script removed -->');
          preview.textContent = safe;
        } catch (err) {
          preview.textContent = raw || '';
        }
      }

      function handleLoadedContent(text) {
        currentContent = text || '';
        previewHTML(currentContent);
      }

      function readFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          handleLoadedContent(reader.result);
        };
        reader.readAsText(file, 'utf-8');
      }

      fileInput.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        readFile(file);
      });

      dropzone.addEventListener('dragover', (event) => {
        event.preventDefault();
        dropzone.classList.add('dragover');
      });

      dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
      });

      dropzone.addEventListener('drop', (event) => {
        event.preventDefault();
        dropzone.classList.remove('dragover');
        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        readFile(file);
      });

      openBtn.addEventListener('click', () => {
        if (!currentContent) {
          alert('Please upload an HTML file first.');
          return;
        }

        const blob = new Blob([currentContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.location.href = url;
      });

      openNewBtn.addEventListener('click', () => {
        if (!currentContent) {
          alert('Please upload an HTML file first.');
          return;
        }

        const blob = new Blob([currentContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);

        const newWindow = window.open(url, '_blank');
        if (!newWindow) {
          alert('Popup blocked. Allow popups for this page and try again.');
        }
      });

      console.log('HTML5 Opener initialized');
    });
  </script>
</body>
</html>
